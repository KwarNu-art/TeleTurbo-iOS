name: TeleTurbo CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build Target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - deb-only
          - ipa-only

permissions:
  contents: write

jobs:
  build-tele-turbo:
    runs-on: macos-13
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos iOS Suite
        run: |
          echo "Setting up Theos..."
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          
          echo "Installing iOS 16.5 SDK..."
          curl -LO https://github.com/xybp888/iOS-SDKs/releases/download/iOS-16.5/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks/
          rm -f iPhoneOS16.5.sdk.tar.xz
          
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Compile TeleTurbo Tweak (.deb & .dylib)
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb ./TeleTurbo-Rootless.deb || true
          
          make clean
          make package FINALPACKAGE=1
          cp packages/*.deb ./TeleTurbo-Rootful.deb || true
          
          mkdir -p build-dylib
          dpkg-deb -x ./TeleTurbo-Rootless.deb ./build-dylib/
          find ./build-dylib -name "*.dylib" -exec cp {} ./TeleTurbo.dylib \;
          ls -la TeleTurbo.dylib

      - name: Package Release Files
        run: |
          zip -r TeleTurbo-Injection-Kit.zip TeleTurbo.dylib src/
          echo "Created TeleTurbo-Injection-Kit.zip"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TeleTurbo-iOS-Build-Artifacts
          path: |
            *.deb
            *.dylib
            *.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0-turbo
          name: 'TeleTurbo Telegram iOS Release v1.0.0'
          body: |
            ## ⚡ TeleTurbo iOS - Ultra Performance & Anti-Thermal Edition
            
            Compiled automatically for **@${{ github.repository_owner }}**:
            - **TeleTurbo-Rootless.deb**: For Dopamine, Taurine, palera1n (iOS 15.0 - 17.0+).
            - **TeleTurbo-Rootful.deb**: For legacy rootful jailbreaks.
            - **TeleTurbo.dylib**: Standalone dynamic library for TrollStore, Azule, or Esign injection.
            - **TeleTurbo-Injection-Kit.zip**: Full injection kit.
          files: |
            *.deb
            *.dylib
            *.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
